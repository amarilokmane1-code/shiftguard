[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "shiftguard"
version = "0.1.0"
description = "Does conformal abstention survive site shift? A multi-site autism neuroimaging benchmark."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Lokmane Amari" }]
keywords = [
    "conformal prediction",
    "distribution shift",
    "abstention",
    "neuroimaging",
    "autism",
    "ABIDE",
    "functional connectivity",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "nilearn>=0.10.3",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "requests>=2.31",
    "joblib>=1.3",
]

[project.optional-dependencies]
# PyTorch MLP. On CPU-only machines install torch from the PyTorch CPU index first
# (see README), otherwise pip may pull the much larger CUDA build.
torch = ["torch>=2.1"]
# ComBat harmonisation.
harmonize = ["neuroHarmonize>=2.4"]
# Full hierarchical Bayesian coverage model (an empirical-Bayes version needs no extra).
bayes = ["pymc>=5.10"]
# Optional graph neural network.
gnn = ["torch>=2.1", "torch-geometric>=2.4"]
notebooks = ["jupyter>=1.0", "ipykernel>=6.0", "nbformat>=5.9", "nbconvert>=7.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "pre-commit>=3.5", "nbformat>=5.9"]

[project.scripts]
shiftguard = "shiftguard.cli:app"

[project.urls]
Repository = "https://github.com/amarilokmane1-code/shiftguard"

[tool.hatch.build.targets.wheel]
packages = ["src/shiftguard"]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-include = ["*.ipynb"]

[tool.ruff.format]
# Generated by notebooks/build_kaggle_notebook.py (formatted itself); still linted.
exclude = ["notebooks/kaggle_shiftguard.ipynb"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "D",   # pydocstyle
    "SIM", # simplify
    "NPY", # numpy-specific rules (e.g. legacy np.random)
    "RUF", # ruff-specific
]
ignore = [
    "D105", # magic-method docstrings
    "D107", # __init__ docstrings (documented on the class)
    "N803", # allow `X` as an argument name (ML convention)
    "N806", # allow `X` as a local variable name
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"notebooks/**" = ["D", "E402", "E501", "RUF001"]
"tasks.py" = ["D"]
# RESULTS.md generator: typographic dashes, minus signs and Greek letters are intended
"src/shiftguard/evaluation/report.py" = ["RUF001"]

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: longer tests (deselect with -m 'not slow')",
    "torch: tests that need PyTorch (skipped if it is not installed)",
]
filterwarnings = ["error::FutureWarning:shiftguard.*"]

[tool.coverage.run]
source = ["shiftguard"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
