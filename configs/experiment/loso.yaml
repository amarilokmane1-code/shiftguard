# Main experiment: leave-one-site-out, plus the within-site (exchangeable) reference.
# The deployment site is never used for training, calibration or hyperparameter tuning
# (except in the explicit few-labelled-target arm of phase 5).
inherit:
  - ../data/abide_cc200.yaml
  - ../model/logreg.yaml
  - ../model/mlp.yaml
  - ../model/calibration.yaml
  - ../conformal/default.yaml

experiment:
  name: loso
  protocols: [within_site, loso]
  base_seed: 0
  n_seeds: 10
  calibration_fraction: 0.30   # train/calibration split inside the training sites
  test_fraction: 0.20          # within-site protocol only
  # splits are always stratified by site x diagnosis (evaluation/protocols.py)
  models: [logreg, mlp]
  n_jobs: -1
