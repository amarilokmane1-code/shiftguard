# Main protocol: leave-one-site-out. The deployment site is never used for training,
# calibration or hyperparameter tuning (except in the explicit few-labelled-target arm).
inherit:
  - ../data/abide_cc200.yaml
  - ../model/logreg.yaml
  - ../conformal/default.yaml

experiment:
  name: loso
  protocol: loso
  base_seed: 0
  n_seeds: 10
  calibration_fraction: 0.30   # train/calibration split inside the training sites
  stratify_by: [SITE_ID, DX_GROUP]
  models: [logreg, mlp]
  n_jobs: -1
