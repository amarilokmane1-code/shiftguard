calibration:
  # Fitted on the calibration split only (phase 4 baselines). In the conformal analysis
  # (phase 5) the calibration split is halved by site x diagnosis: half A fits the
  # temperature, half B is the conformal calibration set, so no point is used twice
  # (METHODS 4.7).
  method: temperature       # temperature | platt | none
  n_bins: 10                # equal-width bins for ECE and reliability diagrams
